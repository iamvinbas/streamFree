name: Feature request
description: An idea that would make streamFree better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the show you are making and what is missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
