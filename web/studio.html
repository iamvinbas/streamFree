<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>streamFree Studio</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/static/favicon.svg" alt="" width="24" height="24"><span>streamFree</span></div>
    <input id="show-title" class="title-input" placeholder="Untitled show" maxlength="80" aria-label="Show title">
    <div id="status" class="status" aria-live="polite"></div>
    <div class="top-actions">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light or dark theme"></button>
      <button id="record-btn" class="btn" type="button">Record</button>
      <button id="live-btn" class="btn primary" type="button">Go live</button>
    </div>
  </header>
  <main class="studio">
    <section class="stage-col">
      <div class="preview-wrap">
        <canvas id="preview" width="1280" height="720" aria-label="Program preview"></canvas>
        <div id="live-badge" class="live-badge" hidden>LIVE</div>
      </div>
      <div id="layouts" class="layouts" role="toolbar" aria-label="Layouts"></div>
      <div id="people" class="people" aria-label="People and sources"></div>
      <div id="controls" class="controls" role="toolbar" aria-label="Controls"></div>
    </section>
    <aside class="sidebar">
      <nav id="tabs" class="tabs" role="tablist" aria-label="Studio panels"></nav>
      <div id="panel" class="panel" role="tabpanel"></div>
    </aside>
  </main>
  <dialog id="dialog" aria-label="Dialog"></dialog>
  <script type="module" src="/static/js/studio.js"></script>
</body>
</html>
